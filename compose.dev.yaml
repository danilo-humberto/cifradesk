# Portas sempre restritas ao host local.
services:
  proxy:
    ports: ['127.0.0.1:${WEB_PORT:-3200}:80']
  web:
    build: { target: development }
    volumes:
      - ./apps/web/src:/app/apps/web/src
    environment:
      NODE_ENV: development
      WATCHPACK_POLLING: 'true'
  mailpit:
    networks: [entry, internal]
    ports: ['127.0.0.1:${MAILPIT_PORT:-58025}:8025']
